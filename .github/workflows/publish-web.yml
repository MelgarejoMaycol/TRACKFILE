name: Publish TrackFile Web

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/publish-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Compile fresh frontend
        run: |
          mkdir -p /tmp/trackfile-downloads
          if [ -d build/web/downloads ]; then
            cp -a build/web/downloads/. /tmp/trackfile-downloads/
          fi
          flutter build web --release
          if [ -d /tmp/trackfile-downloads ]; then
            mkdir -p build/web/downloads
            cp -a /tmp/trackfile-downloads/. build/web/downloads/
          fi

      # Vercel actualmente publica build/web sin ejecutar Flutter.
      # Actualizamos esos artefactos tras los cambios del codigo fuente.
      - name: Update published build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f -- build/web
          if ! git diff --cached --quiet; then
            git commit -m "build(web): refresh deployed Flutter demo [skip ci]"
            git push origin HEAD:main
          else
            echo "No web build changes to publish."
          fi
